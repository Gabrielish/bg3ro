<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="none">
  <defs>
    <linearGradient id="fade" x1="0" x2="0" y1="0" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="white"/><stop offset=".65" stop-color="white"/>
      <stop offset=".76" stop-color="white" stop-opacity=".95"/><stop offset=".84" stop-color="white" stop-opacity=".75"/>
      <stop offset=".93" stop-color="white" stop-opacity=".28"/><stop offset=".99" stop-color="white" stop-opacity=".01"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="smoke" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".008 .018" numOctaves="3" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="45" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <rect x="-100" y="-100" width="1800" height="1200" fill="url(#fade)" filter="url(#smoke)"/>
</svg>
